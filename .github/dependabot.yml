version: 2
updates:
  # Dependabot reads every non-dotted .yml file in these folders and updates the image: references in them, digest pins included.
  - package-ecosystem: "docker"
    directories:
      - "/security-kb/templates"
      - "/security-kb/stacks/*/templates"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
