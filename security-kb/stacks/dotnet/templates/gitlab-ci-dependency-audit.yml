# The image is pinned by digest to SDK 10.0.403, the version this job was tested with. Refresh the digest when a newer 10.0 patch ships.
# `dotnet list package` exits 0 even when it finds vulnerable packages, so the job reads its JSON and fails on high or critical
# findings, and on a "problems" entry (a project that could not be audited).
# Restore already fails on NU1903 and NU1904 when Directory.Build.props from this folder is in use; this job covers the rest.
dependency-audit:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:de4fe90a98845d75910b9769662465c84de1a934665c431279d1382b2bddc02b
  variables:
    CI: "true"
  script:
    - dotnet restore --locked-mode
    - dotnet list package --vulnerable --include-transitive --format json > vulnerable-packages.json
    - |
      if grep -Eq '"severity": *"(High|Critical)"' vulnerable-packages.json; then echo "High or critical vulnerable packages found; see vulnerable-packages.json"; exit 1; fi
      if grep -q '"problems"' vulnerable-packages.json; then echo "dotnet list package reported problems (see vulnerable-packages.json); a clean result proves nothing"; exit 1; fi
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - vulnerable-packages.json
