# Tested with gitleaks v8.30.1: exit 1 on a leak, 0 when clean; --redact keeps the secret out of the report.
secret-scan:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script:
    - gitleaks git --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gitleaks.sarif
