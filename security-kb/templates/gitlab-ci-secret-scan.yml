secret-scan:
  stage: test
  image:
    name: ghcr.io/gitleaks/gitleaks:REPLACE-WITH-PINNED-VERSION
    entrypoint: [""]
  script:
    - gitleaks git --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - gitleaks.sarif
